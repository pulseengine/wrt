artifacts:

  - id: SR-60
    type: requirement
    title: kilnd lowers component-typed arguments (list/record/string) for an invoked export
    status: proposed
    description: "BLOCKED ON pulseengine/meld#400 — deliberately NOT in v0.5.0 so an externally-blocked item cannot hold the release. SR-59 delivered the argument surface for core scalars (i32/i64/f32/f64), which is everything a meld-fused core module lets a runtime construct today. Component-typed parameters (list<u8>, records, strings) arrive at the core boundary already FLATTENED by the canonical ABI into pointers and lengths — e.g. the real released scry-3.3.0 exports 'analyze: func(module-bytes: list<u8>, config: analysis-config)' as 10 core i32s. Building those values requires allocating guest memory via cabi_realloc and writing the payload, which requires the WIT types; and the fused core module carries NONE — wasm-tools reports verbatim 'input is a core wasm module with no component-type* custom sections meaning that there is not WIT information'. Once meld preserves or emits the WIT signature (meld#400 asks for the standard component-type* custom sections, or an equivalent signature manifest), this requirement lowers WAVE-style typed values against it: parse the user's --arg per the declared WIT type, lower via the canonical ABI, and lift the result. Until then kilnd correctly refuses and points the user at meld#400 rather than pretending a call is one --arg away. Relates to SR-59, SR-58, SR-53. Issue #480."
    tags: [kilnd, invoke, canonical-abi, component, blocked-external]
    provenance:
      created-by: ai
      model: claude-opus-5
      timestamp: 2026-09-07T06:59:31Z
    release: v0.6.0
