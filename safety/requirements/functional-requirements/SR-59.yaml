artifacts:

  - id: SR-59
    type: requirement
    title: kilnd can pass arguments to an invoked export (wasm function parameters)
    status: implemented
    description: "MEASURED, and the shape changed. Ground truth from the real released scry-3.3.0-wasm32-wasip2.wasm: the WIT signature is 'analyze: func(module-bytes: list<u8>, config: analysis-config) -> result<analysis-result, analyze-error>' — TWO component-level parameters. The '10 argument(s)' kilnd reports is the canonical-ABI-FLATTENED core signature (list<u8> becomes ptr+len, the record becomes its scalar fields). So a usable argument surface is not 'pass 10 i32s'; it requires real canonical-ABI lowering (allocate guest memory via cabi_realloc, write the list bytes, build the record) driven by the WIT types. CHOSEN SURFACE (maintainer): WAVE-style typed values on the CLI (repeated --arg, parsed against the export's declared WIT types), matching wasmtime's --invoke ergonomics. HARD BLOCKER FOUND: the fused core module carries NO WIT type information. wasm-tools on the fused artifact says verbatim: 'input is a core wasm module with no component-type* custom sections meaning that there is not WIT information'. Custom sections present in the fused module are only .debug_*, producers, target_features, wsc.transformation.attestation and component-provenance (which maps functions to their originating component for attribution — not types). So kilnd cannot know analyze takes (list<u8>, analysis-config); it sees only 10 flattened i32s. Unlike SR-57 — where meld already supplied what kiln needed via canonical export names — this genuinely needs a cross-tool contract: meld should preserve or emit the component-type* custom sections (the standard wit-bindgen convention for embedding WIT in a core module) in fused output, or emit an equivalent signature manifest. Until then only exports whose CORE signature is already scalars (i32/i64/f32/f64) can be invoked with arguments; component-typed exports cannot. Split accordingly. Relates to SR-53 (made the gap visible), SR-58 (routes --invoke to the export). Issue #480."
    tags: [kilnd, cli, invoke, arguments, capability-gap]
    provenance:
      created-by: ai
      model: claude-opus-5
      timestamp: 2026-09-07T03:55:39Z
    release: v0.5.0
